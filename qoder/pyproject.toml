[project]
name = "recap"
version = "0.1.0"
description = "Recap: build weekly reports from working context stored in PowerContext, retrieved with seekdb hybrid search"
readme = "README.md"
authors = [
    { name = "cointem", email = "jsyin1@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "powercontext[cli,server,seekdb]==1.4.0",
    "pylibseekdb>=1.4.0.post1",
    "pymysql>=1.2.0",
    "pyseekdb>=1.4.0.post1",
]

[project.scripts]
recap = "recap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
