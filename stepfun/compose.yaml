name: stepfun-browser-kb
services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    ports:
      - 127.0.0.1:12882:2881
    volumes:
      - knowledge-data:/var/lib/oceanbase
    healthcheck:
      test: [CMD-SHELL, 'mysql -h127.0.0.1 -P2881 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  knowledge-data:
