        x: 3300
        y: 60
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: NPC 演出 + 权威账本
        desc: ''
        code_language: python3
        code: "import json, re, uuid, hashlib\n\ndef main(narration, reply, request_id,\
          \ ending, ui_data):\n    ui = json.loads(ui_data)\n    ui[\"narration\"\
          ] = narration[:1200]\n    narration = narration[:1200].replace(\"&\", \"\
          &amp;\").replace(\"<\", \"&lt;\").replace(\">\", \"&gt;\")\n    for char\
          \ in \"\\\\`*_{}[]()#!\":\n        narration = narration.replace(char, \"\
          \\\\\" + char)\n    return {\"reply\": \"\U0001F3AD **NPC 即兴对白**\\n\\n\"\
          \ + narration + \"\\n\\n---\\n\\n\" + reply,\n            \"request_id\"\
          : request_id, \"ending\": ending, \"mode\": \"Dify LLM 即兴演出\",\n       \
          \     \"ui_data\": json.dumps(ui, ensure_ascii=False)}\n"
