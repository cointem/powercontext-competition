    - id: present
      type: custom
      position:
        x: 2400
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 核验保存凭据，整理事实与旧账
        desc: ''
        code_language: python3
        code: "import json, re, uuid, hashlib\n\ndef main(body, status_code, expected_text,\
          \ result):\n    if status_code != 200:\n        raise ValueError(\"记忆操作未确认成功。请使用原请求编号重试，不要连续点击。\"\
          )\n    saved = json.loads(body)\n    if expected_text and not any(r.get(\"\
          text\") == expected_text for r in saved.get(\"records\", [])):\n       \
          \ raise ValueError(\"PowerContext未返回预期存档，不显示虚假的保存成功\")\n    result = json.loads(result)\n\
          \    state = result[\"state\"]\n    text = \"# 这家客栈会记仇\\n\\n\" + result[\"\
          story\"] + \"\\n\\n\"\n    if result[\"recalled\"]:\n        text += \"\U0001F4D6\
          \ **NPC 翻出的旧账**\\n\\n\" + \"\\n\".join(\"- \" + item[\"text\"] for item\
          \ in result[\"recalled\"]) + \"\\n\\n\"\n    text += (f\"**账本** · 行动 {state['round']}/6\
          \ · 银两 {state['coins']} 文 · 欠款 {state['debt']} 文 · 信誉 {state['reputation']}\\\
          n\\n\"\n             + \"**关系** · \" + \" · \".join(f\"{name} {score:+d}\"\
          \ for name, score in state[\"relationships\"].items()) + \"\\n\\n\")\n \
          \   if state[\"ending\"]:\n        text += \"**本局结局：\" + state[\"ending\"\
          ] + \"**\\n\\n\"\n    text += \"**可选行动**：\" + \" / \".join(result[\"available\"\
          ]) + \"\\n\\n\"\n    if result[\"event\"] == \"help_clerk\":\n        text\
          \ += \"\U0001F4A1 下一次选择「找神秘客」，跑堂会先从记忆中回想你的帮助。\\n\\n\"\n    if result[\"\
          replayed\"]:\n        text += \"本次为已保存回合的重放，没有重复扣款或奖励。\\n\\n\"\n    return\
          \ {\"reply\": text, \"prompt\": json.dumps({\"本轮事实\": result[\"story\"],\
          \ \"账本\": state,\n            \"召回的旧账\": result[\"recalled\"], \"玩家台词\"\
          : result[\"line\"]}, ensure_ascii=False),\n            \"request_id\": result[\"\
          request_id\"], \"ending\": state[\"ending\"],\n            \"ui_data\":\
          \ json.dumps({k: result[k] for k in\n                (\"state\", \"story\"\
          , \"event\", \"consumed\", \"available\", \"recalled\", \"replayed\")},\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: body
          value_selector:
          - save
          - body
        - variable: status_code
          value_selector:
          - save
          - status_code
        - variable: expected_text
          value_selector:
          - rules
          - expected_text
        - variable: result
          value_selector:
          - rules
          - result
