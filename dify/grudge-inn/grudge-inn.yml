version: 0.7.0
kind: app
dependencies: []
app:
  name: 这家客栈会记仇
  description: 六回合留下过夜。Dify原生规则与LLM演出，HTTP直连PowerContext跨会话记忆；无需游戏后端。
  mode: workflow
  icon: 🏮
  icon_background: '#FCE8D0'
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables:
  - id: 830e5b97-4d96-44eb-a3c4-cb41f33db629
    name: PC_URL
    value: http://host.docker.internal:18092
    value_type: string
    description: Dify可访问的PowerContext 1.4.0地址
  - id: 9d8dc3d0-69b4-414c-a6c4-92c0869892cd
    name: PC_TOKEN
    value: ''
    value_type: secret
    description: PowerContext服务鉴权令牌
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 进店：口令、存档、行动
        desc: ''
        variables:
        - variable: player_id
          label: 旅客口令（8位以上随机字符，记好可续玩）
          type: text-input
          required: true
          max_length: 64
        - variable: save_id
          label: 存档号（如 first；换新值重新开局）
          type: text-input
          required: true
          max_length: 32
          default: first
        - variable: action
          label: 本轮行动
          type: select
          options:
          - 进店看看
          - 冒充食评家
          - 借二十文
          - 帮跑堂
          - 帮掌柜
          - 归还借款
          - 坦白道歉
          - 找神秘客
          - 申请入住
          - 回忆旧账
          - 重新开局
          required: true
          default: 进店看看
        - variable: line
          label: 想对 NPC 说的话（AI演出模式使用，不能改账本）
          type: paragraph
          required: false
          max_length: 300
        - variable: performance
          label: 演出模式（AI模式需先配置LLM节点）
          type: select
          options:
          - 规则试玩
          - AI演出
          required: true
          default: 规则试玩
        - variable: request_id
          label: 请求编号（通常留空；失败重试填原编号）
          type: text-input
          required: false
          max_length: 64
    - id: prepare
      type: custom
      position:
        x: 300
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 生成独立存档标识
        desc: ''
        code_language: python3
        code: "import json, re, uuid, hashlib\n\ndef main(player_id, save_id, action,\
          \ line=\"\", request_id=\"\"):\n    if not re.fullmatch(r\"[A-Za-z0-9_-]{8,64}\"\
          , player_id):\n        raise ValueError(\"旅客口令须为8至64位字母、数字、下划线或短横线；请使用难猜的随机值\"\
          )\n    if not re.fullmatch(r\"[A-Za-z0-9_-]{1,32}\", save_id):\n       \
          \ raise ValueError(\"存档号须为1至32位字母、数字、下划线或短横线\")\n    if request_id and not\
          \ re.fullmatch(r\"[A-Za-z0-9_-]{1,64}\", request_id):\n        raise ValueError(\"\
          请求编号格式无效\")\n    if len(line or \"\") > 300:\n        raise ValueError(\"\
          台词最多300字\")\n    key = hashlib.sha256((player_id + \":\" + save_id).encode()).hexdigest()\n\
          \    return {\"scope_body\": json.dumps({\"title\": \"这家客栈会记仇\", \"summary\"\
          : \"Dify客栈游戏的独立存档\",\n        \"idempotency_key\": \"grudge-inn-v1-\" +\
          \ key}, ensure_ascii=False),\n        \"input\": json.dumps({\"action\"\
          : action, \"line\": line or \"\", \"request_id\": request_id or uuid.uuid4().hex},\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: player_id
          value_selector:
          - start
          - player_id
        - variable: save_id
          value_selector:
          - start
          - save_id
        - variable: action
          value_selector:
          - start
          - action
        - variable: line
          value_selector:
          - start
          - line
        - variable: request_id
          value_selector:
          - start
          - request_id
        outputs:
          scope_body:
            type: string
            children: null
          input:
            type: string
            children: null
    - id: scope
      type: custom
      position:
        x: 600
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: PowerContext · 打开存档 Scope
        desc: ''
        method: post
        url: '{{#env.PC_URL#}}/v1/scopes'
        authorization:
          type: no-auth
        headers: 'Content-Type:application/json

          Authorization:Bearer {{#env.PC_TOKEN#}}'
        params: ''
        body:
          type: raw-text
          data:
          - key: ''
            type: text
            value: '{{#prepare.scope_body#}}'
        timeout:
          connect: 10
          read: 60
          write: 20
        retry_config:
          retry_enabled: false
          max_retries: 1
          retry_interval: 1000
    - id: scope_input
      type: custom
      position:
        x: 900
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 准备记忆请求
        desc: ''
        code_language: python3
        code: "import json, re, uuid, hashlib\n\ndef main(body, status_code):\n  \
          \  if status_code not in (200, 201):\n        raise ValueError(\"PowerContext未能打开存档，请检查服务地址与令牌\"\
          )\n    scope = json.loads(body)[\"scope_id\"]\n    return {\"scope\": scope,\
          \ \"list_body\": json.dumps({\"scope_id\": scope, \"limit\": 100}),\n  \
          \          \"recall_body\": json.dumps({\"scope_id\": scope, \"query\":\
          \ \"innledger\", \"max_bytes\": 32768})}\n"
        variables:
        - variable: body
          value_selector:
          - scope
          - body
        - variable: status_code
          value_selector:
          - scope
          - status_code
        outputs:
          scope:
            type: string
            children: null
          list_body:
            type: string
            children: null
          recall_body:
            type: string
            children: null
    - id: inventory
      type: custom
      position:
        x: 1200
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: PowerContext · 读取存档账本
        desc: ''
        method: post
        url: '{{#env.PC_URL#}}/v1/memory/entries/list'
        authorization:
          type: no-auth
        headers: 'Content-Type:application/json

          Authorization:Bearer {{#env.PC_TOKEN#}}'
        params: ''
        body:
          type: raw-text
          data:
          - key: ''
            type: text
            value: '{{#scope_input.list_body#}}'
        timeout:
          connect: 10
          read: 60
          write: 20
        retry_config:
          retry_enabled: false
          max_retries: 1
          retry_interval: 1000
    - id: recall
      type: custom
      position:
        x: 1500
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: PowerContext · 召回 NPC 旧账
        desc: ''
        method: post
        url: '{{#env.PC_URL#}}/v1/context/prepare'
        authorization:
          type: no-auth
        headers: 'Content-Type:application/json

          Authorization:Bearer {{#env.PC_TOKEN#}}'
        params: ''
        body:
          type: raw-text
          data:
          - key: ''
            type: text
            value: '{{#scope_input.recall_body#}}'
        timeout:
          connect: 10
          read: 60
          write: 20
        retry_config:
          retry_enabled: false
          max_retries: 1
          retry_interval: 1000
    - id: rules
      type: custom
      position:
        x: 1800
        y: 220
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 规则裁判：银两、关系、六回合结局
        desc: ''
        code_language: python3
        code: "import json, re, uuid, hashlib\n\"\"\"Deterministic game rules; this\
          \ exact source also runs in a Dify Code node.\"\"\"\nimport copy\n\nACTIONS\
          \ = [\"进店看看\", \"冒充食评家\", \"借二十文\", \"帮跑堂\", \"帮掌柜\", \"归还借款\", \"坦白道歉\"\
          , \"找神秘客\", \"申请入住\", \"回忆旧账\", \"重新开局\"]\n\n\ndef initial_state():\n  \
          \  return {\"round\": 0, \"coins\": 10, \"debt\": 0, \"reputation\": 0,\n\
          \            \"relationships\": {\"掌柜\": 0, \"跑堂\": 0, \"神秘客\": 0},\n  \
          \          \"flags\": [], \"ending\": \"\"}\n\n\ndef available(state, recalled):\n\
          \    if state[\"ending\"]:\n        return [\"回忆旧账\", \"重新开局\"]\n    actions\
          \ = [\"进店看看\", \"回忆旧账\"]\n    flags = state[\"flags\"]\n    for action,\
          \ flag in [(\"冒充食评家\", \"critic\"), (\"借二十文\", \"borrowed\"),\n        \
          \                 (\"帮跑堂\", \"help_clerk\"), (\"帮掌柜\", \"help_owner\")]:\n\
          \        if flag not in flags:\n            actions.append(action)\n   \
          \ if state[\"debt\"] and state[\"coins\"] >= state[\"debt\"]:\n        actions.append(\"\
          归还借款\")\n    if \"critic\" in flags and \"apologized\" not in flags:\n \
          \       actions.append(\"坦白道歉\")\n    if \"help_clerk\" in flags and \"\
          help_clerk\" in recalled and \"recommended\" not in flags:\n        actions.append(\"\
          找神秘客\")\n    return actions + [\"申请入住\", \"重新开局\"]\n\n\ndef settle(state):\n\
          \    flags = state[\"flags\"]\n    if state[\"debt\"] == 0 and state[\"\
          reputation\"] >= 2 and \"recommended\" in flags:\n        state[\"ending\"\
          ] = \"贵宾入住\"\n        return \"【贵宾入住】神秘客亮出东家的玉牌：我信的不是头衔，是跑堂记住的那次援手。掌柜送你天字一号房。\"\
          \n    if state[\"reputation\"] >= 0 and (\"help_clerk\" in flags or \"help_owner\"\
          \ in flags):\n        state[\"ending\"] = \"打工抵债\"\n        return \"【打工抵债】掌柜递来围裙：有欠款就慢慢还，没有欠款就抵房费。你靠做事留下，今晚住后院，明早一起开门。\"\
          \n    state[\"ending\"] = \"被赶出门\"\n    return \"【被赶出门】掌柜合上账簿：客栈欢迎有故事的人，可惜你留下的只有欠条和空头名号。跑堂送你到门口。\"\
          \n\n\ndef resolve(data):\n    state = copy.deepcopy(data[\"state\"])\n \
          \   action = data[\"action\"]\n    recalled = {item[\"event\"] for item\
          \ in data.get(\"recalled\", [])}\n    flags = state[\"flags\"]\n    event\
          \ = \"\"\n    story = \"\"\n    consumed = False\n    if action == \"重新开局\"\
          :\n        story = \"请把输入里的「存档号」换成一个新名字，例如 second，再选择「进店看看」。新档从十文钱、零欠款开始；原存档仍可随时回来继续。\"\
          \n    elif action == \"回忆旧账\":\n        story = \"三人把账簿摊在桌上：\" if recalled\
          \ else \"账簿暂时没有召回记录。先在客栈留下一个故事吧。\"\n    elif state[\"ending\"]:\n      \
          \  story = \"这局已经落幕。你可以回忆旧账，或重新开局体验另一条路。\"\n    elif action == \"进店看看\"\
          :\n        story = \"雨越下越大。掌柜拨着算盘，跑堂抱着快掉落的碗，角落里的神秘客只喝白水。你有十文起步钱和六次行动机会，想办法留下过夜。观察与回忆不耗回合。\"\
          \n        if \"borrow\" in recalled:\n            story += \"\\n跑堂认出了你：借过我二十文的那位，我可没忘。\"\
          \ + (\"欠款还在。\" if state[\"debt\"] else \"钱已经还清，谢谢你守约。\")\n        if \"\
          critic\" in recalled:\n            story += \"\\n掌柜挑眉：大食评家，又见面了。\" + (\"\
          你后来坦白了，咱们看行动。\" if \"apologized\" in flags else \"你的文章准备什么时候交？\")\n    elif\
          \ action not in available(state, recalled):\n        story = \"这件事现在做不了，或已经做过。重复劳动不会重复发工钱；神秘客需要跑堂先从账簿中想起你的帮助。请查看下面的可选行动。\"\
          \n    else:\n        consumed = True\n        if action == \"冒充食评家\":\n\
          \            flags.append(\"critic\")\n            state[\"reputation\"\
          ] -= 2\n            state[\"relationships\"][\"掌柜\"] -= 1\n            event\
          \ = \"critic\"\n            story = \"你自称名扬京城的食评家，蹭到一碗招牌面。掌柜看着你拿筷子的架势，默默记下：文章欠一篇，可信度减两分。\"\
          \n        elif action == \"借二十文\":\n            flags.append(\"borrowed\"\
          )\n            state[\"coins\"] += 20\n            state[\"debt\"] = 20\n\
          \            event = \"borrow\"\n            story = \"跑堂把攒下的二十文放进你手里：说好了，打烊前还。我记性好，换个窗口来聊天也没用。\"\
          \n        elif action == \"帮跑堂\":\n            flags.append(\"help_clerk\"\
          )\n            state[\"coins\"] += 10\n            state[\"reputation\"\
          ] += 2\n            state[\"relationships\"][\"跑堂\"] += 2\n            event\
          \ = \"help_clerk\"\n            story = \"你接住即将倒下的碗，又擦完三张桌子。跑堂给你十文工钱：这次援手我记下了，角落那位贵客或许愿意见你。\"\
          \n        elif action == \"帮掌柜\":\n            flags.append(\"help_owner\"\
          )\n            state[\"coins\"] += 10\n            state[\"reputation\"\
          ] += 1\n            state[\"relationships\"][\"掌柜\"] += 2\n            event\
          \ = \"help_owner\"\n            story = \"你核对账簿，发现掌柜少算了一桌的钱。他给你十文工钱：肯认真做事，比会报头衔强。\"\
          \n        elif action == \"归还借款\":\n            state[\"coins\"] -= state[\"\
          debt\"]\n            state[\"debt\"] = 0\n            state[\"reputation\"\
          ] += 1\n            state[\"relationships\"][\"跑堂\"] += 1\n            event\
          \ = \"repay\"\n            story = \"你把二十文数齐还给跑堂。他在旧欠条上盖了个大大的“已还”：旧账我记得，新账也不会漏。\"\
          \n        elif action == \"坦白道歉\":\n            flags.append(\"apologized\"\
          )\n            state[\"reputation\"] += 1\n            state[\"relationships\"\
          ][\"掌柜\"] += 1\n            event = \"apology\"\n            story = \"\
          你承认食评家的名号是编的。掌柜收起催稿纸条：面吃了就吃了，别把我的信任也吃掉。\"\n        elif action == \"找神秘客\"\
          :\n            flags.append(\"recommended\")\n            state[\"relationships\"\
          ][\"神秘客\"] += 2\n            event = \"recommend\"\n            story =\
          \ \"跑堂从账簿中想起你接碗的事，把你介绍给神秘客。对方递来一张推荐帖：有欠款先还清，信誉至少两分，我便为你担保。\"\n        elif\
          \ action == \"申请入住\":\n            event = \"checkout\"\n            story\
          \ = settle(state)\n        state[\"round\"] += 1\n        if state[\"round\"\
          ] == 6 and not state[\"ending\"]:\n            story += \"\\n\\n打烊的钟响了。\"\
          \ + settle(state)\n    return {\"state\": state, \"story\": story, \"event\"\
          : event, \"consumed\": consumed,\n            \"available\": available(state,\
          \ recalled)}\n\ndef make_output(result, scope, snapshot):\n    text = \"\
          innledger \" + json.dumps(snapshot, ensure_ascii=False, separators=(\",\"\
          , \":\")) if snapshot else \"\"\n    if len(text.encode()) > 8192:\n   \
          \     raise ValueError(\"存档超过记忆大小限制，本轮未写入\")\n    if snapshot:\n       \
          \ path = \"/v1/memory/remember\"\n        payload = {\"scope_id\": scope,\
          \ \"kind\": \"inn_save_v1\", \"text\": text, \"reason\": \"Dify游戏规则确认的回合，供跨会话恢复和NPC召回复用\"\
          }\n    else:\n        path = \"/v1/context/prepare\"\n        payload =\
          \ {\"scope_id\": scope, \"query\": \"innledger\", \"max_bytes\": 512}\n\
          \    return {\"write_path\": path, \"write_body\": json.dumps(payload, ensure_ascii=False),\n\
          \            \"expected_text\": text, \"result\": json.dumps(result, ensure_ascii=False)}\n\
          \ndef main(inventory, inventory_status, memory, memory_status, scope, input):\n\
          \    # initial_state, resolve and ACTIONS are bundled from rules.py by the\
          \ generator.\n    if inventory_status != 200 or memory_status != 200:\n\
          \        raise ValueError(\"读取PowerContext失败，本轮未推进，请恢复记忆服务后重试\")\n    user\
          \ = json.loads(input)\n    if user[\"action\"] not in ACTIONS:\n       \
          \ raise ValueError(\"请选择有效行动\")\n    entries = json.loads(inventory)\n \
          \   if entries.get(\"next_cursor\"):\n        raise ValueError(\"存档出现过多记录，请换新存档号；不会使用不完整的历史继续\"\
          )\n    snapshots = []\n    for record in entries[\"entries\"]:\n       \
          \ if record.get(\"kind\") == \"inn_save_v1\" and record.get(\"state\") ==\
          \ \"active\":\n            snapshot = json.loads(record[\"text\"].removeprefix(\"\
          innledger \"))\n            if snapshot[\"schema\"] != 1 or not 1 <= snapshot[\"\
          state\"][\"round\"] <= 6:\n                raise ValueError(\"存档版本或回合无效\"\
          )\n            snapshots.append(snapshot)\n    snapshots.sort(key=lambda\
          \ x: x[\"state\"][\"round\"])\n    by_round = {}\n    for snapshot in snapshots:\n\
          \        turn = snapshot[\"state\"][\"round\"]\n        if turn in by_round\
          \ and snapshot != by_round[turn]:\n            raise ValueError(\"检测到同档并发操作冲突，请换新存档；每个存档请串行游玩\"\
          )\n        by_round[turn] = snapshot\n    latest = snapshots[-1] if snapshots\
          \ else {\"state\": initial_state(), \"events\": []}\n    for snapshot in\
          \ snapshots:\n        if snapshot[\"input\"][\"request_id\"] == user[\"\
          request_id\"]:\n            if snapshot[\"input\"] != user:\n          \
          \      raise ValueError(\"请求编号已用于不同输入，请换新编号\")\n            result = snapshot[\"\
          result\"]\n            result[\"replayed\"] = True\n            return make_output(result,\
          \ scope, None)\n    prepared = json.loads(memory)\n    content = prepared.get(\"\
          content\") or \"\"\n    start = \"BEGIN_POWERCONTEXT_PREPARED_CONTEXT_V1\"\
          \n    end = \"END_POWERCONTEXT_PREPARED_CONTEXT_V1\"\n    recalled_events\
          \ = []\n    if start in content and end in content:\n        payload = json.loads(content.split(start,\
          \ 1)[1].split(end, 1)[0].strip())\n        for item in payload.get(\"items\"\
          , []):\n            value = item.get(\"content\", \"\")\n            if\
          \ item.get(\"truncated\") or not value.startswith(\"innledger \"):\n   \
          \             continue\n            recalled_events.extend(json.loads(value[len(\"\
          innledger \"):]).get(\"events\", []))\n    # An event must exist in both\
          \ the durable save and actual PreparedContext recall.\n    recalled = [event\
          \ for event in latest[\"events\"] if event in recalled_events]\n    result\
          \ = resolve({\"state\": latest[\"state\"], \"action\": user[\"action\"],\
          \ \"recalled\": recalled})\n    result.update(recalled=recalled, request_id=user[\"\
          request_id\"], line=user[\"line\"], replayed=False)\n    event_text = {\n\
          \        \"critic\": \"玩家冒充食评家蹭面，掌柜记住了这个谎言。\",\n        \"borrow\": \"玩家向跑堂借了二十文，承诺打烊前归还。\"\
          ,\n        \"help_clerk\": \"玩家接住跑堂的碗并擦桌，跑堂愿意介绍神秘客。\",\n        \"help_owner\"\
          : \"玩家帮掌柜核对账簿，赢得掌柜信任。\",\n        \"repay\": \"玩家归还了二十文借款，欠款已结清。\",\n  \
          \      \"apology\": \"玩家向掌柜坦白并道歉，不再冒充食评家。\",\n        \"recommend\": \"\
          神秘客经跑堂介绍赠送推荐帖，愿为玩家担保。\",\n        \"checkout\": \"玩家申请入住，掌柜根据履约情况结算。\"}\n\
          \    snapshot = None\n    if result[\"consumed\"]:\n        events = latest[\"\
          events\"] + [{\"event\": result[\"event\"], \"text\": event_text[result[\"\
          event\"]]}]\n        # Save only authoritative rules and confirmed recall,\
          \ never generated narration.\n        snapshot = {\"schema\": 1, \"state\"\
          : result[\"state\"], \"events\": events, \"input\": user, \"result\": result}\n\
          \    return make_output(result, scope, snapshot)\n"
