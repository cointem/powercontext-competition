name: dify-time-hotel
services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    volumes:
      - hotel-data:/var/lib/oceanbase
    healthcheck:
      test: [CMD-SHELL, 'mysql -h127.0.0.1 -P2881 -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 40
  hotel:
    build: .
    env_file: .env
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: '2881'
      SEEKDB_DATABASE: dify_time_hotel
    depends_on:
      seekdb:
        condition: service_healthy
    ports:
      - 127.0.0.1:${HOTEL_PORT:-18089}:18089
volumes:
  hotel-data:
